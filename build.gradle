plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "maven.modrinth:iris:${project.iris_version}"
    modImplementation "maven.modrinth:sodium:${project.sodium_version}"
    modImplementation "maven.modrinth:modmenu:${project.modmenu_version}"
    // Iris ships some libs as nested jars, but Loom dev runtime does not always expose them on runClient classpath.
    implementation "org.anarres:jcpp:1.4.14"
    runtimeOnly "io.github.douira:glsl-transformer:2.0.1"

    modImplementation "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.12.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.12.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def shaderGameTestBlockToggleCount = System.getProperty("photonics.automation.blockToggleCount")
if (shaderGameTestBlockToggleCount == null || shaderGameTestBlockToggleCount.isBlank()) {
    shaderGameTestBlockToggleCount = System.getenv("PHOTONICS_AUTOMATION_BLOCK_TOGGLE_COUNT")
}
if (shaderGameTestBlockToggleCount == null || shaderGameTestBlockToggleCount.isBlank()) {
    shaderGameTestBlockToggleCount = "0"
}

def shaderGameTestTimeOfDaySequence = System.getProperty("photonics.automation.timeOfDaySequence")
if (shaderGameTestTimeOfDaySequence == null) {
    shaderGameTestTimeOfDaySequence = System.getenv("PHOTONICS_AUTOMATION_TIME_OF_DAY_SEQUENCE")
}
if (shaderGameTestTimeOfDaySequence == null) {
    shaderGameTestTimeOfDaySequence = ""
}

def runtimeMaxLights = System.getProperty("photonics.maxLights")
if (runtimeMaxLights == null || runtimeMaxLights.isBlank()) {
    runtimeMaxLights = System.getenv("PHOTONICS_MAX_LIGHTS")
}
if (runtimeMaxLights == null || runtimeMaxLights.isBlank()) {
    runtimeMaxLights = "4096"
}

def mainClasspathGroup = "${layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath}${File.pathSeparator}${layout.buildDirectory.dir('resources/main').get().asFile.absolutePath}"

loom {
    runs {
        client {
            client()
            runDir = "run"
            vmArg "-Xms2G"
            vmArg "-Xmx8G"
            vmArg "-Dfabric.classPathGroups=${mainClasspathGroup}"
            vmArg "-Dphotonics.maxLights=${runtimeMaxLights}"
        }
        shaderGameTestClient {
            client()
            runDir = "run"
            vmArg "-Xms2G"
            vmArg "-Xmx8G"
            vmArg "-Dfabric.classPathGroups=${mainClasspathGroup}"
            vmArg "-Dphotonics.maxLights=${runtimeMaxLights}"
            programArg "--quickPlaySingleplayer"
            programArg "backup"
            programArg "--quickPlayPath"
            programArg "quickPlay/log.json"
            vmArg "-Dphotonics.automation.enabled=true"
            vmArg "-Dphotonics.profilerEnabled=true"
            // Keep shaderGameTest close to runClient. Diagnostic freeze, seed, isolation,
            // and ReSTIR override properties are intentionally not forwarded here.
            vmArg "-Dphotonics.automation.worldName=backup"
            vmArg "-Dphotonics.automation.autoStartWorld=false"
            vmArg "-Dphotonics.automation.startDelayTicks=220"
            vmArg "-Dphotonics.automation.timeoutTicks=2400"
            vmArg "-Dphotonics.automation.expectedShaderPack=shaders.zip"
            vmArg "-Dphotonics.automation.reportFile=${project.projectDir.toPath().resolve('run/automation/shader-report.properties')}"
            vmArg "-Dphotonics.automation.captureDir=${project.projectDir.toPath().resolve('run/automation/captures')}"
            vmArg "-Dphotonics.automation.captureEveryN=120"
            vmArg "-Dphotonics.automation.captureEveryActiveTicks=75"
            vmArg "-Dphotonics.automation.captureCount=8"
            vmArg "-Dphotonics.automation.minLitCaptures=8"
            vmArg "-Dphotonics.automation.minActiveTicksBeforeSuccess=900"
            vmArg "-Dphotonics.automation.minActiveTicksAfterSignal=360"
            vmArg "-Dphotonics.automation.cameraMotion=yaw_sine"
            // Start motion well before the first repeated-phase comparison so motion-repeat
            // validation measures steady-state direct lighting instead of the motion-onset transient.
            vmArg "-Dphotonics.automation.cameraMotionStartActiveTick=180"
            vmArg "-Dphotonics.automation.cameraMotionPeriodTicks=120"
            vmArg "-Dphotonics.automation.cameraYawAmplitudeDegrees=35"
            vmArg "-Dphotonics.automation.cameraPitchAmplitudeDegrees=8"
            vmArg "-Dphotonics.automation.timeOfDaySequence=${shaderGameTestTimeOfDaySequence}"
            vmArg "-Dphotonics.automation.timeOfDayStartActiveTick=780"
            vmArg "-Dphotonics.automation.timeOfDayStepTicks=60"
            vmArg "-Dphotonics.automation.blockToggleStartActiveTick=1020"
            vmArg "-Dphotonics.automation.blockTogglePeriodTicks=60"
            vmArg "-Dphotonics.automation.blockToggleCount=${shaderGameTestBlockToggleCount}"
            vmArg "-Dphotonics.automation.maxMotionRepeatDirectDeltaAvg=0.04"
            vmArg "-Dphotonics.automation.maxMotionRepeatDirectDeltaMax=0.08"
            vmArg "-Dphotonics.automation.maxMotionRepeatIndirectDeltaAvg=0.06"
            vmArg "-Dphotonics.automation.maxMotionRepeatIndirectDeltaMax=0.10"
            vmArg "-Dphotonics.automation.maxDirectTemporalDeltaAvg=0.05"
            vmArg "-Dphotonics.automation.maxDirectTemporalDeltaMax=0.10"
            vmArg "-Dphotonics.automation.maxIndirectTemporalDeltaAvg=0.06"
            vmArg "-Dphotonics.automation.maxIndirectTemporalDeltaMax=0.10"
            vmArg "-Dphotonics.automation.maxIndirectLinearOverbrightFraction=0.020"
            vmArg "-Dphotonics.automation.maxIndirectLinearSevereFireflyFraction=0.0005"
            vmArg "-Dphotonics.automation.maxIndirectRawLinearOverbrightFraction=0.030"
            vmArg "-Dphotonics.automation.releaseMouse=true"
            vmArg "-Dphotonics.automation.fullscreen=false"
            vmArg "-Dphotonics.automation.requireDirectSignal=true"
            vmArg "-Dphotonics.automation.autoStop=true"
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            exclude 'test/**'
        }
        resources {
            srcDirs = ['.']
            include 'fabric.mod.json'
            include 'photonics.mixins.json'
            include 'assets/**'
            include 'META-INF/**'
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

def java21Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = java21Launcher
}

def renderdocScript = file("scripts/renderdoc-launch.ps1")

tasks.register("renderdocPrepareClient", Exec) {
    group = "fabric"
    description = "Generates RenderDoc launch files for the default Minecraft client."
    dependsOn "classes", "configureClientLaunch"
    workingDir project.projectDir
    commandLine "powershell", "-ExecutionPolicy", "Bypass", "-File", renderdocScript.absolutePath, "-Target", "Client"
}

tasks.register("renderdocPrepareShaderGameTest", Exec) {
    group = "fabric"
    description = "Generates RenderDoc launch files for the shader game test client."
    dependsOn "classes", "configureClientLaunch"
    workingDir project.projectDir
    commandLine "powershell", "-ExecutionPolicy", "Bypass", "-File", renderdocScript.absolutePath, "-Target", "ShaderGameTestClient"
}

tasks.register("renderdocClient", Exec) {
    group = "fabric"
    description = "Launches the default Minecraft client through RenderDoc."
    dependsOn "classes", "configureClientLaunch"
    workingDir project.projectDir
    commandLine "powershell", "-ExecutionPolicy", "Bypass", "-File", renderdocScript.absolutePath, "-Target", "Client", "-Launch"
}

tasks.register("renderdocShaderGameTest", Exec) {
    group = "fabric"
    description = "Launches the shader game test client through RenderDoc."
    dependsOn "classes", "configureClientLaunch"
    workingDir project.projectDir
    commandLine "powershell", "-ExecutionPolicy", "Bypass", "-File", renderdocScript.absolutePath, "-Target", "ShaderGameTestClient"
    args "-Launch"
}

tasks.named("test") {
    useJUnitPlatform()
}

tasks.register("patchValidationTest", Test) {
    group = "verification"
    description = "Runs automated shader patch validation tests."
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching "at.redi2go.photonic.client.rendering.patching.*"
    }
}

def glslangValidatorExecutable = (findProperty("glslangValidator") ?: System.getenv("GLSLANG_VALIDATOR") ?: "glslangValidator").toString()

tasks.register("shaderValidationTest", Test) {
    group = "verification"
    description = "Runs offline GLSL validation against resolved Photonics shader entrypoints."
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty "photonics.projectDir", project.projectDir.absolutePath
    systemProperty "photonics.buildDir", layout.buildDirectory.get().asFile.absolutePath
    systemProperty "photonics.glslangValidator", glslangValidatorExecutable
    filter {
        includeTestsMatching "at.redi2go.photonic.client.rendering.validation.*"
    }
}

tasks.register("automationValidation") {
    group = "verification"
    description = "Runs offline shader validation, patch validation tests, and full build verification."
    dependsOn "patchValidationTest", "shaderValidationTest", "build"
}

tasks.register("shaderGameTest") {
    group = "verification"
    description = "Runs automated shader runtime smoke test and validates report/log evidence."
    dependsOn "cleanShaderGameTestArtifacts", "runShaderGameTestClient"
    doLast {
        File reportFile = file("run/automation/shader-report.properties")
        if (!reportFile.exists()) {
            throw new GradleException("Missing shader automation report: ${reportFile}")
        }

        Properties props = new Properties()
        reportFile.withInputStream { props.load(it) }

        if (!Boolean.parseBoolean(props.getProperty("success", "false"))) {
            throw new GradleException("Shader automation report failed: ${props.getProperty('failureReason', 'unknown reason')}")
        }

        if (!Boolean.parseBoolean(props.getProperty("expectedShaderPackMatched", "false"))) {
            throw new GradleException("Unexpected shader pack in automation run: ${props.getProperty('shaderPackName', '')}")
        }

        String expectedPatchIdPrefix = props.getProperty("expectedPatchIdPrefix", "")
        if (expectedPatchIdPrefix && !Boolean.parseBoolean(props.getProperty("patchIdMatches", "false"))) {
            throw new GradleException("Unexpected automation patch id: ${props.getProperty('patchId', '')} (expected prefix ${expectedPatchIdPrefix})")
        }

        if (!Boolean.parseBoolean(props.getProperty("raytracerActive", "false"))) {
            throw new GradleException("Raytracer was not active during automation run")
        }

        if (!Boolean.parseBoolean(props.getProperty("lightingSignalDetected", "false"))) {
            throw new GradleException(
                "No lighting signal detected in captured attachments "
                    + "(directMaxLuma=${props.getProperty('directMaxLuma', '0')}, "
                    + "directSoftMaxLuma=${props.getProperty('directSoftMaxLuma', '0')}, "
                    + "handheldMaxLuma=${props.getProperty('handheldMaxLuma', '0')})"
            )
        }

        int capturesTaken = Integer.parseInt(props.getProperty("capturesTaken", "0"))
        int captureTarget = Integer.parseInt(props.getProperty("captureTarget", "0"))
        if (captureTarget <= 0 || capturesTaken < captureTarget) {
            throw new GradleException("Insufficient frame captures: ${capturesTaken}/${captureTarget}")
        }

        File latestLog = file("run/logs/latest.log")
        if (!latestLog.exists()) {
            throw new GradleException("Missing client log file: ${latestLog}")
        }

        String logContent = latestLog.getText("UTF-8")
        List<String> forbiddenPatterns = [
                "Error while parsing the block ID map entry",
                "NullPointerException",
                "Disabling automation frame capture after failure"
        ]
        List<String> hits = forbiddenPatterns.findAll { logContent.contains(it) }
        if (!hits.isEmpty()) {
            throw new GradleException("Shader automation found forbidden log patterns: ${hits.join(', ')}")
        }

        List<String> requiredProfilerPatterns = [
                "[Profiler] upload:",
                "[Profiler] compileWorld:"
        ]
        List<String> missingProfilerPatterns = requiredProfilerPatterns.findAll { !logContent.contains(it) }
        if (!missingProfilerPatterns.isEmpty()) {
            throw new GradleException("Shader automation missing profiler evidence: ${missingProfilerPatterns.join(', ')}")
        }

        println "shaderGameTest passed: captures=${capturesTaken}/${captureTarget}, patch=${props.getProperty('patchId', '')}, pack=${props.getProperty('shaderPackName', '')}"
    }
}

tasks.register("cleanShaderGameTestArtifacts") {
    group = "verification"
    description = "Cleans shader automation output from prior runs."
    doLast {
        delete file("run/automation")
        File quickPlayWorld = file("run/saves/backup/level.dat")
        if (!quickPlayWorld.exists()) {
            throw new GradleException("Missing required Quick Play world save: run/saves/backup/level.dat")
        }
        File staleWorldDir = file("run/saves/photonics_shader_test")
        if (staleWorldDir.exists() && !file("run/saves/photonics_shader_test/level.dat").exists()) {
            delete staleWorldDir
        }
    }
}

tasks.register("gameTest") {
    group = "verification"
    description = "Runs automated shader game test verification."
    dependsOn "shaderGameTest"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("LICENSE_Photonic") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

